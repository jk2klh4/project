<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Ремонт ноутбуков</title>
</head>
<body class="d-flex flex-column h-100">
    //= template/header.html
<main class="flex-shrink-0">
    <div class="container mt-4">
        <h1 class="mb-3">Ремонт ноутбуков</h1>
        <div class="row">
            <div class="col-md-6">
                <img src="img/card-1.jpg" class="img-fluid" alt="Ремонт ноутбуков">
            </div>
            <div class="col-md-6">
                <p>
                    Ремонтируем ноутбуки любых моделей: проводим диагностику, замены комплектующих
                </p>
                <p class="mb-3">Стоимость: от 1 500 руб.</p>
                <a href="catalog.html" class="btn btn-success">Назад в каталог</a>
            </div>
        </div>
        <div class="accordion" id="myAcc">
            <div class="accordion-item mt-2">
                <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#item1">
                Сколько дней занимает ремонт?
                </button>
                <div id="item1" class="accordion-collapse collapse show" data-bs-parent="#myAcc">
                <div class="accordion-body">В зависимости от поломки, в среднем от 1-го до 3-х дней</div>
                </div>
            </div>

            <div class="accordion-item">
                <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#item2">
                На какой срок выдается гарантия?
                </button>
                <div id="item2" class="accordion-collapse collapse" data-bs-parent="#myAcc">
                <div class="accordion-body">Гарантия от нашего сервиса дается на год</div>
                </div>
            </div>
        </div>
    </div>
</main>

    //= template/footer.html

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
