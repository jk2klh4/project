<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Ремонт электроники</title>
</head>
<body class="d-flex flex-column h-100">
    <header class="header">
        <nav class="navbar navbar-expand">
            <div class="container">
                <div class="row w-100 align-items-center justify-content-end">
                    <div class="col-md-3">
                        <a class="navbar-brand" href="index.html">Ремонт электроники</a>
                    </div>  
                    <div class="col-md-5">
                        <ul class="navbar-nav justify-content-center">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Главная</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="about.html">О нас</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="catalog.html">Каталог</a>
                            </li>
                        </ul>
                    </div>
                    <div class="col-md-4 d-flex justify-content-end">  
                        <form class="d-flex header__search" role="search">
                            <input class="form-control" type="search" placeholder="Поиск" aria-label="Поиск">
                            <button class="btn btn-outline-success" type="submit">Найти</button>
                        </form>
                    </div> 
                </div>
            </div>
        </nav>
    </header>
    <main class="flex-shrink-0">
        <div class="container p-4">
            <section class="jumbotron text-white p-4">
                <h1 class="mb-3">Услуги ремонта электроники</h1>
                <p class="jumbotron__text">Быстрое обслуживание клиентов, удобное местоположение</p>
                <a href="catalog.html" class="btn btn-success">Каталог услуг</a>
            </section>
            <section class="form py-4">
                <div class="row justify-content-center">
                    <div class="col-lg-4">
                        <form class="p-4">
                            <h2 class="h5 mb-3">Регистрация</h2>
                            <div class="mb-3">
                                <label for="exampleInputEmail" class="form-label">Адрес электронной почты</label>
                                <input type="email" class="form-control" id="exampleInputEmail" name="email">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputFio" class="form-label">ФИО</label>
                                <input type="text" class="form-control" id="exampleInputFio" name="fio">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputPassword" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="exampleInputPassword" name="password">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Отправить</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <footer class="footer mt-auto">
        <div class="container">
            <div class="row align-items-center justify-content-between">
                <div class="col-md-3">
                    <h5 class="">Контакты</h5>
                    <p class="">+7(999)-999-99-99</p>
                    <p class="">123@gmail.ru</p>
                </div>  
    
                <div class="col-md-4">
                    <ul class="nav d-flex flex-column align-items-center">
                        <li class="nav-item"><a class="nav-link link-body-emphasis" href="index.html">Главная</a></li>
                        <li class="nav-item"><a class="nav-link link-body-emphasis" href="about.html">О нас</a></li>
                        <li class="nav-item"><a class="nav-link link-body-emphasis" href="catalog.html">Каталог</a></li>
                    </ul>
                </div>
                <div class="col-md-3 d-flex flex-column align-items-end gap-3">  
                    <a href="" class="nav-link">ВКонтакте</a>
                    <a href="" class="nav-link">Telegram</a>
                    <a href="" class="nav-link">Instagram</a>
                </div> 
            </div>
        </div>
    </footer>
</body>
</html>
